# Project-wide Gradle settings.
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# JDK is pinned via the Gradle toolchain in app/build.gradle.kts (jvmToolchain(17)),
# so compilation is reproducible regardless of the machine's default JDK. If your
# default `java` on PATH is older than 17 and the toolchain can't locate a JDK 17
# install, set `org.gradle.java.home` in your USER-level ~/.gradle/gradle.properties
# — do NOT hardcode a machine path in this committed file.
